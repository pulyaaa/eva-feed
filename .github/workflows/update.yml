name: Update XML feed
on:
  schedule:
    - cron: '0 * * * *'  # каждый час
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch feed
        run: |
          curl -o feed.xml "https://speceffect.shop/products_feed.xml?hash_tag=80ca85d4f491a77112f138bf26f8d627&sales_notes=&product_ids=&label_ids=129025959&exclude_fields=&html_description=1&yandex_cpa=&process_presence_sure=&languages=uk%2Cru&extra_fields=quantityInStock%2Ckeywords&group_ids="
      - name: Commit
        run: |
          git config user.email "bot@bot.com"
          git config user.name "Bot"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Update feed"
          git push
